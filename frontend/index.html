<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-box">
    <h1>Team Task Manager</h1>
    <p>Login or signup to manage projects and tasks</p>

    <input id="apiUrl" placeholder="Backend URL e.g. http://localhost:8080" value="http://localhost:8080" />

    <div class="tabs">
      <button onclick="showLogin()">Login</button>
      <button onclick="showSignup()">Signup</button>
    </div>

    <div id="loginForm">
      <input id="loginEmail" type="email" placeholder="Email" />
      <input id="loginPassword" type="password" placeholder="Password" />
      <button onclick="login()">Login</button>
    </div>

    <div id="signupForm" class="hidden">
      <input id="signupName" placeholder="Full Name" />
      <input id="signupEmail" type="email" placeholder="Email" />
      <input id="signupPassword" type="password" placeholder="Password minimum 6 chars" />
      <select id="signupRole">
        <option value="MEMBER">MEMBER</option>
        <option value="ADMIN">ADMIN</option>
      </select>
      <button onclick="signup()">Create Account</button>
    </div>

    <p id="message"></p>
  </div>
  <script src="app.js"></script>
</body>
</html>
